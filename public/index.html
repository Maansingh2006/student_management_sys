<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Student Management System</h1>
        <div class="main-buttons">
            <button onclick="showAdd()">
                Add Student
            </button>
            <button onclick="openReports()">
                Reports
            </button>
            <button onclick="openUpdate()">
                Update Student
            </button>
            <button onclick="openReceipt()">
                Generate Receipt
            </button>
        </div>
        <div id="addSection" class="card">
            <h2>Add Student</h2>
            <form id="studentForm">
                <input type="text" id="form_id" placeholder="Form ID" required>
                <input type="text" id="name" placeholder="Student Name" required>
                <input type="text" id="father_name" placeholder="Father Name">
                <input type="text" id="phone" placeholder="Phone">
                <input type="text" id="course" placeholder="Course">
                <input type="email" id="email" placeholder="Email">
                <input type="text" id="Totalfees" placeholder="Totalfees">
                <input type="text" id="Paidfees" placeholder="Paidfees">
                <input type="text" id="Duefees" placeholder="Duefees">
                <button type="submit">
                    Add Student
                </button>
            </form>
            <p id="addMessage"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
